<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crab Chess</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <h1>🦀 Crab Chess</h1>
    <div id="status"></div>
    <div id="board"></div>
    <div id="board3d" hidden></div>
    <div id="controls">
      <select id="mode" aria-label="Game mode">
        <option value="human">2 players</option>
        <option value="easy">vs Computer · Easy</option>
        <option value="normal">vs Computer · Normal</option>
        <option value="hard">vs Computer · Hard</option>
      </select>
      <button id="resign">Resign</button>
      <button id="new">New game</button>
      <button id="view">2D view</button>
      <button id="mute" title="Sound on/off" aria-label="Sound on/off">🔊</button>
    </div>
    <p class="help">White = Player 1 (W/A/S/D, X) · Black = Player 2 (I/J/K/L, M) or the computer. Every capture is settled by a minigame. 3D: drag to rotate, scroll to zoom.</p>
    <div id="overlay" hidden></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
